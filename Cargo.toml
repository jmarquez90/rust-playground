[package]
name = "playground"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", optional = true }
dashmap = "6.2.1"
mimalloc = "0.1.52"
rayon = "1.12.0"
rustc-hash = { version = "2.1.3", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1

[features]
ahash = ["dep:ahash"]
rustc-hash = ["dep:rustc-hash"]
